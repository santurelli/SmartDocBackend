spring.application.name=smartdoc-backend

# Database Configuration (Service DB)
spring.datasource.url=jdbc:postgresql://localhost:5432/smartdoc_service_db
spring.datasource.username=smartdoc
spring.datasource.password=smartdoc
spring.datasource.driver-class-name=org.postgresql.Driver

# Tenant Databases
datasource.riggiolandia.url=jdbc:postgresql://localhost:5432/sd_riggiolandia
datasource.romax.url=jdbc:postgresql://localhost:5432/sd_romax
datasource.justdesign.url=jdbc:postgresql://localhost:5432/sd_justdesign
datasource.justeat.url=jdbc:postgresql://localhost:5432/sd_justeat
datasource.justfood.url=jdbc:postgresql://localhost:5432/sd_justfood
datasource.piuforty.url=jdbc:postgresql://localhost:5432/sd_piuforty
datasource.santurelli.url=jdbc:postgresql://localhost:5432/sd_santurelli

# Common Credentials (assuming same for all as per legacy)
datasource.common.username=smartdoc
datasource.common.password=smartdoc
datasource.common.driver-class-name=org.postgresql.Driver

# JPA Configuration

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Port
server.port=8080

# Batch & Scheduling Configuration (Specific Hours)
# Invoice Sending: 10, 12, 14, 16, 18, 20, 22
smartdoc.batch.invio.cron=0 0 10,12,14,16,18,20,22 * * *
# Outcome Retrieval: 11, 13, 15, 17, 19, 21, 23
smartdoc.batch.esiti.cron=0 0 11,13,15,17,19,21,23 * * *
smartdoc.batch.esiti_invio.cron=0 30 10,12,14,16,18,20,22 * * *

# Prevents Spring Batch from running all jobs on startup
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# Allows overriding beans (necessary for legacy XML job definitions in Spring Boot 3)
spring.main.allow-bean-definition-overriding=true

# Mail Configuration (Brevo SMTP)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=a7be35001@smtp-brevo.com
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# SmartDoc Custom Mail Properties
smartdoc.mail.from=noreply@smart-doc.it
smartdoc.mail.fromName=SmartDoc System
smartdoc.mail.to.fastorder=assistenza@fastorder.it
smartdoc.mail.to.justdesign=admin@justdesign.it
smartdoc.mail.subject.scarti=Report anomalie fatture elettroniche
