spring.application.name=smartdoc-backend

# Database Configuration (Service DB)
spring.datasource.url=jdbc:postgresql://localhost:6432/smartdoc_service_db?prepareThreshold=0&ignore_startup_parameters=extra_float_digits
spring.datasource.username=smartdoc
spring.datasource.password=smartdoc
spring.datasource.driver-class-name=org.postgresql.Driver

# Database Condiviso per tutti i Tenant (Shared DB)
datasource.shared.url=jdbc:postgresql://localhost:6432/smartdoc_shared_db?prepareThreshold=0&ignore_startup_parameters=extra_float_digits

# Credenziali Comuni
datasource.common.username=smartdoc
datasource.common.password=smartdoc
datasource.common.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Port
server.port=8080

# Batch Working Directory (server-level, not tenant-specific)
# Corrisponde al volume mappato nel docker-compose: /mnt/HC_Volume_4221021/tomcat_work/jobs:/mnt/HC_Volume_4221021/tomcat_work/jobs
smartdoc.batch.workdir=/mnt/HC_Volume_4221021/tomcat_work/jobs

# Batch & Scheduling Configuration (Specific Hours)
# Invoice Sending: 10, 12, 14, 16, 18, 20, 22
smartdoc.batch.invio.cron=0 0 10,12,14,16,18,20,22 * * *
# Outcome Retrieval: 11, 13, 15, 17, 19, 21, 23
smartdoc.batch.esiti.cron=0 0 11,13,15,17,19,21,23 * * *
smartdoc.batch.esiti_invio.cron=0 30 10,12,14,16,18,20,22 * * *
# Promemoria scadenzario: una volta al giorno alle 07:00
smartdoc.batch.scadenzario.cron=0 0 7 * * *
smartdoc.batch.scheduling.enabled=true

# Batch & Scheduling Configuration
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.batch.jdbc.platform=postgresql

# Allows overriding beans (necessary for legacy XML job definitions in Spring Boot 3)
spring.main.allow-bean-definition-overriding=true

# Logging
logging.level.it.tinna.smartdoc.server.security=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.it.tinna.smartdoc.server.database=DEBUG

# Mail Configuration (Brevo SMTP)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=a7be35001@smtp-brevo.com
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# SmartDoc Custom Mail Properties
smartdoc.mail.from=noreply@smart-doc.it
smartdoc.mail.fromName=SmartDoc System
smartdoc.mail.to.fastorder=assistenza@fastorder.it
smartdoc.mail.to.justdesign=admin@justdesign.it
smartdoc.mail.subject.scarti=Report anomalie fatture elettroniche

# OpenAI (cattura documenti con AI - solo piano Enterprise)
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

# Upload file (necessario per la cattura documenti con AI: foto/PDF fino a 15MB)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Stripe Payment & Webhook Configuration
stripe.api.key=${STRIPE_API_KEY:sk_test_xxx}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_xxx}

# Stripe Price IDs for Plan Detection
stripe.price.smart.annual=${STRIPE_PRICE_SMART_ANNUAL:price_smart_annual}
stripe.price.smart.monthly=${STRIPE_PRICE_SMART_MONTHLY:price_smart_monthly}

stripe.price.professional.annual=${STRIPE_PRICE_PROFESSIONAL_ANNUAL:price_professional_annual}
stripe.price.professional.monthly=${STRIPE_PRICE_PROFESSIONAL_MONTHLY:price_professional_monthly}

stripe.price.enterprise.annual=${STRIPE_PRICE_ENTERPRISE_ANNUAL:price_enterprise_annual}
stripe.price.enterprise.monthly=${STRIPE_PRICE_ENTERPRISE_MONTHLY:price_enterprise_monthly}
